<script type="text/plain" id="tpl">#@title 🧪 Angelina Lab v2 — تنظیمات رو عوض کن و اجرا کن { display-mode: "form" }
# ============================== تنظیمات ==============================
SYMBOLS = "BTC,ETH,SOL,XRP,ADA,DOGE,SUI"  #@param {type:"string"}
YEARS = 6  #@param {type:"number"}
DAYS = 0  #@param {type:"number"}
FIB_TF = "4h"  #@param ["1m", "3m", "5m", "15m", "1h", "4h", "1d"]
PIVOT = 20  #@param {type:"integer"}
WAVE_METHOD = "B (bos)"  #@param ["A (origin)", "B (bos)", "C (lastpivot)", "between"]
ENTRY_LEVEL = 0.618  #@param {type:"number"}
PATH_TF = "5m"  #@param ["1m", "3m", "5m", "15m", "1h"]
GAP_MODE = "market"  #@param ["market", "skip", "market786"]
SIDES = "both"  #@param ["both", "long", "short"]
SIDE_RULE = "4h"  #@param ["none", "4h", "1d"]
WRONG_SIDE_DIV = "strong_or_hidden"  #@param ["strong_or_hidden", "strong", "hidden", "block"]
MIN_SL_PCT = 0.0  #@param {type:"number"}
BAD_HOURS_UTC = ""  #@param {type:"string"}
EXIT_MODE = "multi"  #@param ["single", "multi"]
SINGLE_TP_EXTRA_PCT = 1.0  #@param {type:"number"}
SL_PAD_PCT = 0.09  #@param {type:"number"}
TP1_PART = 0.5  #@param {type:"number"}
TP2_PART = 0.2  #@param {type:"number"}
TP2_EXT = 1.618  #@param {type:"number"}
TP3_MODE = "divergence"  #@param ["divergence", "extension", "none"]
TP3_EXT = 2.0  #@param {type:"number"}
BE_AFTER = "TP2"  #@param ["TP1", "TP2", "never"]
DIV_TF = "4h"  #@param ["1h", "4h", "1d"]
STRONG_RSI_DIFF = 5.0  #@param {type:"number"}
STRONG_RSI_LONG = 30.0  #@param {type:"number"}
STRONG_RSI_SHORT = 70.0  #@param {type:"number"}
CAPITAL = 500.0  #@param {type:"number"}
MARGIN = 20.0  #@param {type:"number"}
LEVERAGE = 10.0  #@param {type:"number"}
FEE_PCT = 0.05  #@param {type:"number"}
ONE_POSITION_PER_SYMBOL = True  #@param {type:"boolean"}
WAIT_BARS = 500  #@param {type:"integer"}
CACHE_DIR = "/content/fr_cache"  #@param {type:"string"}
OUT_DIR = "/content/lab_results"  #@param {type:"string"}
GRID = ""  #@param {type:"string"}
# =====================================================================
# پیش‌فرض‌ها = Angelina2 (MA200ِ 4h) با خروجِ جدید. برایِ Angelina: SIDE_RULE="none" · EXIT_MODE="single" · SL_PAD_PCT=0
# همه‌چیز فقط با کندل‌هایِ بسته‌شده و پیووتِ تأییدشده. کندلی که هم SL هم تارگت رو لمس کنه ← SL.
# GRID = چند حالت در یه اجرا، مثلاً:  PIVOT=10,20,30; ENTRY_LEVEL=0.618,0.78; FIB_TF=1h,4h  ← همه‌یِ ترکیب‌ها اجرا میشن
# 1m و 3m داده‌یِ خیلی زیادی دارن: برایِ این‌ها DAYS رو کوتاه بذار (مثلاً ۳۰ تا ۹۰).

import os, sys, time, subprocess
subprocess.run([sys.executable, "-m", "pip", "install", "-q", "ccxt"], check=False)
import numpy as np, pandas as pd

TF_MS = {"1m": 60_000, "3m": 180_000, "5m": 300_000, "15m": 900_000, "1h": 3_600_000, "4h": 14_400_000, "1d": 86_400_000}
WMAP = {"A (origin)": "origin", "B (bos)": "bos", "C (lastpivot)": "lastpivot", "between": "between"}


# ------------------------------------------------------------- داده
def fetch(ex, sym, tf, since_ms, until_ms):
    os.makedirs(CACHE_DIR, exist_ok=True)
    path = os.path.join(CACHE_DIR, f"{sym}_{tf}.csv.gz")
    cols = ["t", "open", "high", "low", "close", "volume"]
    old = pd.read_csv(path) if os.path.exists(path) else pd.DataFrame(columns=cols)
    step = TF_MS[tf]
    cur = max(int(old["t"].max()) + step, since_ms) if len(old) else since_ms
    if len(old) and int(old["t"].min()) > since_ms + step:
        old, cur = pd.DataFrame(columns=cols), since_ms
    rows, tries, last_save = [], 0, time.time()
    while cur < until_ms:
        try:
            raw = ex.fetch_ohlcv(f"{sym}/USDT:USDT", tf, since=cur, limit=300); tries = 0
        except Exception as e:  # noqa: BLE001
            tries += 1
            if tries > 6:
                print(f"    {sym} {tf}: خطا ({e})"); break
            time.sleep(2 * tries); continue
        if not raw:
            cur += step * 300; continue
        rows += raw; nxt = int(raw[-1][0]) + step
        cur = nxt if nxt > cur else cur + step * 300
        if time.time() - last_save > 60:
            old = pd.concat([old, pd.DataFrame(rows, columns=cols)]).drop_duplicates("t").sort_values("t"); rows = []
            old.to_csv(path, index=False, compression="gzip"); last_save = time.time()
            print(f"    {sym} {tf}: تا {pd.Timestamp(cur, unit='ms'):%Y-%m-%d}", flush=True)
    if rows:
        old = pd.concat([old, pd.DataFrame(rows, columns=cols)]).drop_duplicates("t").sort_values("t")
    old = old[old["t"] + step <= min(until_ms, int(time.time() * 1000))].reset_index(drop=True)
    old.to_csv(path, index=False, compression="gzip")
    return old.astype({"t": np.int64})


class Frame:
    def __init__(self, d, tf):
        self.tf = tf
        self.t = d["t"].to_numpy(np.int64); self.ct = self.t + TF_MS[tf]
        self.O, self.H, self.L, self.C = (d[c].to_numpy(float) for c in ("open", "high", "low", "close"))
        self.ma = pd.Series(self.C).rolling(200, min_periods=200).mean().to_numpy()

    def closed_idx(self, t_ms):
        return np.searchsorted(self.ct, np.asarray(t_ms, np.int64), side="right") - 1


# ------------------------------------------------------------- پیووت، موج، واگرایی
def pivots(H, L, n):
    ph, pl = [], []
    for j in range(n, len(H) - n):
        if H[j] > H[j - n:j].max() and H[j] >= H[j + 1:j + n + 1].max():
            ph.append(j)
        if L[j] < L[j - n:j].min() and L[j] <= L[j + 1:j + n + 1].min():
            pl.append(j)
    return ph, pl


def waves(F, n, mode, max_back=5000):
    H, L, C = F.H, F.L, F.C
    ph, pl = pivots(H, L, n)
    out = []
    for piv, kind in ((ph, 1), (pl, -1)):
        prev, prev_j = None, None
        other = pl if kind == 1 else ph
        for j in piv:
            a = prev + 1 if prev is not None else max(0, j - 10 * n)
            prev = j
            if mode == "lastpivot":
                cands = [q for q in other if q < j]
                if not cands:
                    continue
                i0 = cands[-1]
                p1, p0 = (L[i0], H[j]) if kind == 1 else (H[i0], L[j])
                if (kind == 1 and p0 > p1) or (kind == -1 and p0 < p1):
                    out.append((j + n, kind, float(p1), float(p0)))
                continue
            if mode == "bos":
                if prev_j is None:
                    prev_j = j; continue
                lvl = H[prev_j] if kind == 1 else L[prev_j]
                seg = C[prev_j + 1:j + 1]
                broke = (seg > lvl).any() if kind == 1 else (seg < lvl).any()
                a = prev_j + 1; prev_j = j
                if not broke:
                    continue
            if mode == "origin":
                lo = max(0, j - max_back)
                idx = np.flatnonzero(H[lo:j] > H[j] if kind == 1 else L[lo:j] < L[j])
                a = lo + int(idx[-1]) + 1 if len(idx) else lo
            if j - a < 1:
                continue
            if kind == 1:
                i0 = a + int(np.argmin(L[a:j])); p1, p0 = L[i0], H[j]
                if p0 <= p1:
                    continue
            else:
                i0 = a + int(np.argmax(H[a:j])); p1, p0 = H[i0], L[j]
                if p0 >= p1:
                    continue
            out.append((j + n, kind, float(p1), float(p0)))
    out.sort(key=lambda w: w[0])
    return out


def fib(p1, p0, r):
    return p0 + r * (p1 - p0)


def rsi(c, n=14):
    d = np.diff(np.asarray(c, float), prepend=np.nan)
    up = pd.Series(np.where(d > 0, d, 0.0)).ewm(alpha=1 / n, adjust=False, min_periods=n).mean()
    dn = pd.Series(np.where(d < 0, -d, 0.0)).ewm(alpha=1 / n, adjust=False, min_periods=n).mean()
    return (100 - 100 / (1 + up / dn.replace(0, np.nan))).fillna(100.0).where(up.notna()).to_numpy()


def div_flags(F, n=3, gap=(5, 60), valid=10):
    H, L, C = F.H, F.L, F.C
    N = len(C); r = rsi(C)
    out = {k: np.zeros(N, bool) for k in ("bull_strong", "bull_hid", "bear_strong", "bear_hid")}
    ph, pl = pivots(H, L, n)
    for piv, Y, kind in ((pl, L, "bull"), (ph, H, "bear")):
        for a in range(1, len(piv)):
            p1, p2 = piv[a - 1], piv[a]
            if not (gap[0] <= p2 - p1 <= gap[1]) or not (np.isfinite(r[p1]) and np.isfinite(r[p2])) or p2 + n >= N:
                continue
            key = None
            if kind == "bull":
                if Y[p2] < Y[p1] and r[p2] - r[p1] >= STRONG_RSI_DIFF and r[p1] < STRONG_RSI_LONG:
                    key = "bull_strong"
                elif Y[p2] > Y[p1] and r[p2] < r[p1]:
                    key = "bull_hid"
            else:
                if Y[p2] > Y[p1] and r[p1] - r[p2] >= STRONG_RSI_DIFF and r[p1] > STRONG_RSI_SHORT:
                    key = "bear_strong"
                elif Y[p2] < Y[p1] and r[p2] > r[p1]:
                    key = "bear_hid"
            if key:
                out[key][p2 + n:min(N, p2 + n + valid)] = True
    return out


def _first(m):
    i = int(np.argmax(m)) if len(m) else 0
    return i if len(m) and m[i] else None


# ------------------------------------------------------------- ورود و خروج
def find_entry(P, side, lv, sl, p0, a, stop, lv786):
    H, L = P.H[a:stop], P.L[a:stop]
    touch = _first((L <= lv) if side == 1 else (H >= lv))
    brk = _first((H > p0) if side == 1 else (L < p0))
    if touch is None or (brk is not None and brk <= touch):
        return None, None, False
    if (H[touch] < lv) if side == 1 else (L[touch] > lv):
        o = float(P.O[a + touch])
        if GAP_MODE == "skip" or ((o <= sl) if side == 1 else (o >= sl)):
            return None, None, False
        if GAP_MODE == "market786" and ((o < lv786) if side == 1 else (o > lv786)):
            return None, None, False
        return a + touch, o, True
    return a + touch, lv, False


def sim_exit(P, Fd, dflag, e, side, entry, p1, p0, max_bars):
    """خروجی: لیستِ (سهم، قیمت، برچسب، زمانِ ms)."""
    sl = p1 * (1 - side * SL_PAD_PCT / 100)
    end = min(len(P.H), e + 1 + max_bars)
    H, L, C = P.H, P.L, P.C
    hit = lambda a, px, fav: _first((H[a:end] >= px) if (side == 1) == fav else (L[a:end] <= px))
    if (L[e] <= sl) if side == 1 else (H[e] >= sl):
        return [(1.0, sl, "SL", int(P.ct[e]))]
    if EXIT_MODE == "single":
        tp = p0 * (1 + side * SINGLE_TP_EXTRA_PCT / 100)
        i_s, i_t = hit(e + 1, sl, False), hit(e + 1, tp, True)
        if i_s is not None and (i_t is None or i_s <= i_t):
            return [(1.0, sl, "SL", int(P.ct[e + 1 + i_s]))]
        if i_t is not None:
            return [(1.0, tp, "TP", int(P.ct[e + 1 + i_t]))]
        return [(1.0, float(C[end - 1]), "پایانِ مهلت", int(P.ct[end - 1]))]
    t1, t2 = p0, fib(p1, p0, 1 - TP2_EXT)
    t3 = fib(p1, p0, 1 - TP3_EXT) if TP3_MODE == "extension" else None
    f1, f2 = TP1_PART, TP2_PART; f3 = max(0.0, 1 - f1 - f2)
    parts, stop, k = [], sl, e + 1
    i_s, i_1 = hit(k, stop, False), hit(k, t1, True)
    if i_1 is None or (i_s is not None and i_s <= i_1):
        return [(1.0, stop, "SL", int(P.ct[k + i_s]))] if i_s is not None else [(1.0, float(C[end - 1]), "پایانِ مهلت", int(P.ct[end - 1]))]
    k1 = k + i_1; parts.append((f1, t1, "TP1", int(P.ct[k1])))
    if BE_AFTER == "TP1":
        stop = entry
    i_s, i_2 = hit(k1 + 1, stop, False), hit(k1, t2, True)
    j_s = None if i_s is None else k1 + 1 + i_s; j_2 = None if i_2 is None else k1 + i_2
    if j_2 is None or (j_s is not None and j_s <= j_2):
        lab = "SL در ورود" if stop == entry else "SL"
        parts.append((f2 + f3, stop, lab, int(P.ct[j_s])) if j_s is not None else (f2 + f3, float(C[end - 1]), "پایانِ مهلت", int(P.ct[end - 1])))
        return parts
    parts.append((f2, t2, "TP2", int(P.ct[j_2])))
    if f3 <= 0:
        return parts
    if BE_AFTER in ("TP1", "TP2"):
        stop = entry
    i_s = hit(j_2 + 1, stop, False); j_s = None if i_s is None else j_2 + 1 + i_s
    if TP3_MODE == "extension":
        i_3 = hit(j_2, t3, True); j_3 = None if i_3 is None else j_2 + i_3
        if j_3 is not None and (j_s is None or j_3 < j_s):
            parts.append((f3, t3, "TP3", int(P.ct[j_3]))); return parts
    elif TP3_MODE == "divergence" and Fd is not None:
        cand = np.flatnonzero(dflag & (Fd.ct >= P.ct[j_2]))
        if len(cand):
            kd = int(np.searchsorted(P.t, Fd.ct[cand[0]]))
            if j_s is None or j_s >= kd:
                parts.append((f3, float(Fd.C[cand[0]]), "TP3 واگرایی", int(Fd.ct[cand[0]]))); return parts
    lab = "SL در ورود" if stop == entry else "SL"
    parts.append((f3, stop, lab, int(P.ct[j_s])) if j_s is not None else (f3, float(C[end - 1]), "پایانِ مهلت", int(P.ct[end - 1])))
    return parts


# ------------------------------------------------------------- سرمایه و گزارش
def portfolio(d):
    ev = [(t, 1, i) for i, t in enumerate(d["خروج_ms"])] + [(t, 2, i) for i, t in enumerate(d["زمانِ ورود"])]
    ev.sort()
    eq, used, opened, taken, curve, mx = CAPITAL, 0.0, set(), np.zeros(len(d), bool), [], 0
    for t, kind, i in ev:
        sym = d.at[i, "نماد"]
        if kind == 1 and taken[i]:
            eq += d.at[i, "$"]; used -= MARGIN; opened.discard(sym); curve.append((t, eq))
        elif kind == 2:
            if (ONE_POSITION_PER_SYMBOL and sym in opened) or eq - used < MARGIN:
                continue
            taken[i] = True; used += MARGIN; opened.add(sym); mx = max(mx, len(opened))
    return taken, mx


def streaks(u):
    out = {}
    for name, cond in (("باخت", lambda v: v <= 0), ("برد", lambda v: v > 0)):
        best, c, s, i0, runs = (0, 0.0, None, None), 0, 0.0, 0, []
        for i, v in enumerate(u):
            if cond(v):
                if c == 0:
                    i0, s = i, 0.0
                c += 1; s += v
                if c > best[0]:
                    best = (c, s, i0, i)
            else:
                if c:
                    runs.append(c)
                c = 0
        if c:
            runs.append(c)
        out[name] = (best, pd.Series(runs, dtype=int).value_counts().sort_index().to_dict())
    return out


SETTING_NAMES = ["SYMBOLS", "YEARS", "DAYS", "FIB_TF", "PIVOT", "WAVE_METHOD", "ENTRY_LEVEL", "PATH_TF", "GAP_MODE", "SIDES", "SIDE_RULE", "WRONG_SIDE_DIV",
                 "MIN_SL_PCT", "BAD_HOURS_UTC", "EXIT_MODE", "SINGLE_TP_EXTRA_PCT", "SL_PAD_PCT", "TP1_PART", "TP2_PART", "TP2_EXT", "TP3_MODE", "TP3_EXT",
                 "BE_AFTER", "DIV_TF", "STRONG_RSI_DIFF", "STRONG_RSI_LONG", "STRONG_RSI_SHORT", "CAPITAL", "MARGIN", "LEVERAGE", "FEE_PCT",
                 "ONE_POSITION_PER_SYMBOL", "WAIT_BARS"]
_DATA, _WAVES, _DIVS = {}, {}, {}


def parse_grid(text):
    """«PIVOT=10,20; FIB_TF=1h,4h» ← لیستِ دیکشنری‌ها (همه‌یِ ترکیب‌ها)."""
    import itertools
    axes = []
    for part in [p.strip() for p in text.replace("\n", ";").split(";") if p.strip()]:
        if "=" not in part:
            raise SystemExit(f"❌ GRID: «{part}» فرمتش درست نیست (باید NAME=v1,v2 باشه)")
        k, v = [x.strip() for x in part.split("=", 1)]
        if k not in SETTING_NAMES:
            raise SystemExit(f"❌ GRID: تنظیمی به اسمِ {k} نیست")
        base = globals()[k]
        vals = []
        for x in [x.strip() for x in v.split(",") if x.strip()]:
            if isinstance(base, bool):
                vals.append(x.lower() in ("1", "true", "yes", "بله"))
            elif isinstance(base, int):
                vals.append(int(float(x)))
            elif isinstance(base, float):
                vals.append(float(x))
            else:
                vals.append(x)
        axes.append((k, vals))
    if not axes:
        return [{}]
    return [dict(zip([k for k, _ in axes], combo)) for combo in itertools.product(*[v for _, v in axes])]


def get_frame(ex, sym, tf, start, end, warm):
    key = (sym, tf)
    if key not in _DATA:
        d = fetch(ex, sym, tf, start - warm, end)
        _DATA[key] = Frame(d, tf) if len(d) >= 300 else None
    return _DATA[key]

        if Fw is None or P is None or Fd is None or (SIDE_RULE != "none" and Fs is None):
            print(f"  {sym}: داده‌یِ کافی نیست"); continue

        if dk not in _DIVS:

            if Fw.ct[k] < start or (SIDES == "long" and side == -1) or (SIDES == "short" and side == 1):
                continue
            a = int(np.searchsorted(P.t, Fw.ct[k]))
            if a >= len(P.t):
                continue
            lv = fib(p1, p0, ENTRY_LEVEL); sl = p1 * (1 - side * SL_PAD_PCT / 100)
            e, entry, gap = find_entry(P, side, lv, sl, p0, a, min(len(P.t), a + WAIT_BARS * fac), fib(p1, p0, 0.786))
            if e is None or not ((sl < entry < p0) if side == 1 else (p0 < entry < sl)):
                continue

            if abs(entry - sl) / entry * 100 < MIN_SL_PCT or (t_e // 3_600_000 % 24) in bad:
                continue
            if Fs is not None:
                j = Fs.closed_idx(np.array([t_e]))[0]
                if j < 0 or not np.isfinite(Fs.ma[j]):
                    continue

                    jd = Fd.closed_idx(np.array([t_e]))[0]
                    if WRONG_SIDE_DIV == "block" or jd < 0:

            parts = sim_exit(P, Fd, dflag, e, side, entry, p1, p0, 5000 * fac)
            gross = sum(f * side * (px - entry) / entry for f, px, _, _ in parts)
            cost = fee + sum(f * fee * px / entry for f, px, _, _ in parts)
            rows.append({"نماد": sym, "جهت": "لانگ" if side == 1 else "شورت", "زمانِ ورود": t_e, "خروج_ms": max(p[3] for p in parts),
                         "ورود": entry, "SL٪": abs(entry - sl) / entry * 100, "شکاف": gap, "مسیر": "+".join(p[2] for p in parts),
                         "$": (gross - cost) * pos})
    return rows


def evaluate(rows):
    if not rows:
        return None
    d = pd.DataFrame(rows).sort_values("زمانِ ورود").reset_index(drop=True)
    taken, mx = portfolio(d)
    t = d[taken].sort_values("خروج_ms").reset_index(drop=True)
    if not len(t):
        return None
    u = t["$"].to_numpy()
    eq = CAPITAL + np.cumsum(u); pk = np.maximum.accumulate(np.r_[CAPITAL, eq])[1:]
    w, l = u[u > 0].sum(), -u[u <= 0].sum()
    st = streaks(u)
    M = t.groupby(pd.to_datetime(t["خروج_ms"], unit="ms").dt.to_period("M"))["$"].sum()
    summary = {"معاملات": len(u), "برد٪": round(100 * (u > 0).mean(), 1), "سرمایه‌یِ پایانی $": round(eq[-1], 0), "خالص $": round(u.sum(), 0),
               "PF": round(w / l, 2) if l else float("inf"), "Drawdown $": round((eq - pk).min(), 0), "ضررِ متوالی": st["باخت"][0][0],
               "سودِ متوالی": st["برد"][0][0], "میانگینِ ماهانه $": round(M.mean(), 1), "کمترین سرمایه $": round(eq.min(), 0)}
    return {"d": d, "t": t, "u": u, "eq": eq, "pk": pk, "st": st, "M": M, "mx": mx, "summary": summary}


def full_report(r, start, end, title):
    d, t, u, eq, pk, M = r["d"], r["t"], r["u"], r["eq"], r["pk"], r["M"]
    (ln, ls, la, lb), lr = r["st"]["باخت"]; (wn, ws, _, _), _ = r["st"]["برد"]
    i = int(np.argmin(eq - pk)); w, l = u[u > 0].sum(), -u[u <= 0].sum()
    dt = lambda k: pd.to_datetime(t.loc[k, "خروج_ms"], unit="ms").date() if k is not None else "-"
    t = t.copy(); t["سال"] = pd.to_datetime(t["خروج_ms"], unit="ms").dt.year
    Y = t.groupby("سال")["$"].agg(["size", "sum", lambda x: int((x > 0).sum())]); Y.columns = ["معاملات", "سود $", "برد"]
    Y["سرمایه‌یِ پایانِ سال $"] = pd.Series(eq, index=t["سال"]).groupby(level=0).last()
    S = t.groupby("نماد")["$"].agg(["size", "sum", lambda x: 100 * (x > 0).mean()]); S.columns = ["معاملات", "سود $", "برد٪"]
    ts = lambda ms: pd.Timestamp(int(ms), unit="ms").strftime("%Y-%m-%d")
    cur = {k: globals()[k] for k in SETTING_NAMES}
    return [f"# {title} · {ts(start)} تا {ts(end)} · {t['نماد'].nunique()} نماد", "", "تنظیمات: " + " · ".join(f"{k}={v}" for k, v in cur.items()), "",
            f"- **معاملات: {len(u)}** (برد {int((u > 0).sum())} · باخت {int((u <= 0).sum())} · برد٪ {100 * (u > 0).mean():.1f}) · لانگ {int((t['جهت'] == 'لانگ').sum())} · شورت {int((t['جهت'] == 'شورت').sum())} · ستاپ‌ها {len(d)}",
            f"- **سرمایه: ${CAPITAL:g} → ${eq[-1]:,.0f}** (خالص ${u.sum():+,.0f}) · PF {w / l if l else float('inf'):.2f} · هر معامله ${u.mean():+.2f} (برد ${u[u > 0].mean() if (u > 0).any() else 0:+.2f} · باخت ${u[u <= 0].mean() if (u <= 0).any() else 0:+.2f})",

            f"- حداکثر پوزیشنِ هم‌زمان {r['mx']} · میانگینِ ماهانه ${M.mean():+.1f} · ماهِ مثبت/منفی {int((M > 0).sum())}/{int((M < 0).sum())}",
            f"- مسیرِ خروج: " + " · ".join(f"{k}: {v}" for k, v in t["مسیر"].value_counts().head(8).items()), "",
            "## سالانه", Y.round(1).to_string(), "", "## نماد", S.round(1).sort_values("سود $", ascending=False).to_string(), "",
            "## ماهانه ($)", " ".join(f"{str(k)[2:]}:{v:+.0f}" for k, v in M.items())]

        txt += [f"# مقایسه‌یِ {len(combos)} حالت (مرتب بر اساسِ سود)", "", "پایه: " + " · ".join(f"{k}={v}" for k, v in base.items() if k not in keys), "",
                G[cols].to_string(index=False), "",

      grid.appendChild(w);
    }
    form.appendChild(d);
  }
  ladder(); combo();
}
form.addEventListener('click', e => {
  const b = e.target.closest('.multi'); if (!b) return;
  const n = b.dataset.name, f = fields.find(x => x.name === n);
  if (multi[n]) delete multi[n]; else multi[n] = f.type === 'select' ? [state[n]] : [String(state[n])];
  save(); render();
});
form.addEventListener('input', e => {
  const mn = e.target.dataset && e.target.dataset.multi;
  if (mn) {
    const f = fields.find(x => x.name === mn);
    if (f.type === 'select') multi[mn] = [...form.querySelectorAll(`input[data-multi="${mn}"]:checked`)].map(x => x.value);
    else multi[mn] = e.target.value.split(',').map(x => x.trim()).filter(Boolean);
    save(); combo(); return;
  }
  const f = fields.find(x => x.name === e.target.name); if (!f) return;
  state[f.name] = f.type === 'bool' ? e.target.checked : (f.type === 'int' || f.type === 'num') ? (e.target.value === '' ? f.def : Number(e.target.value)) : e.target.value;
  save(); ladder(); combo();
});
function gridItems() { return Object.entries(multi).filter(([k, v]) => v && v.length > 1); }
function gridText() { return gridItems().map(([k, v]) => `${k}=${v.join(',')}`).join('; '); }
function combo() {
  const it = gridItems(); const n = it.reduce((a, [, v]) => a * v.length, 1);
  const tfs = [state.FIB_TF, state.PATH_TF, ...((multi.FIB_TF || [])), ...((multi.PATH_TF || []))];
  const small = tfs.some(t => t === '1m' || t === '3m');
  const days = Math.max(Number(state.DAYS) || 0, ...((multi.DAYS || []).map(Number)));
  let h = it.length ? `${n} حالت در یه اجرا` : 'یه حالت (بدونِ مقایسه)';
  if (n > 300) h += ' — <span class="warn">بیشتر از ۳۰۰؛ چند مقدار رو کم کن</span>';
  if (small && (days === 0 || days > 90)) h += ' — <span class="warn">با 1m یا 3m، روز رو ۹۰ یا کمتر بذار</span>';
  document.getElementById('combo').innerHTML = h + (it.length ? `<small>${gridText()}</small>` : '');
}
function pyVal(f, v) {
  if (f.type === 'bool') return v ? 'True' : 'False';
  if (f.type === 'int') return String(Math.round(Number(v)));
  if (f.type === 'num') { const n = Number(v); return Number.isInteger(n) ? n.toFixed(1) : String(n); }
  return JSON.stringify(String(v));
}
function colabCell() {
  return TPL.split('\n').map(ln => { const m = ln.match(LINE); if (m && m[1] === 'GRID') return `GRID = ${JSON.stringify(gridText())}${m[3]}`; if (!m || !(m[1] in state)) return ln; const f = fields.find(x => x.name === m[1]); return `${m[1]} = ${pyVal(f, state[m[1]])}${m[3]}`; }).join('\n');
}
function telegram() {
  const out = ['⚙️ Angelina Lab — تنظیمات'];
  for (const g of GROUPS) { const fs = fields.filter(f => META[f.name][0] === g && g !== 'پیشرفته'); if (!fs.length) continue; out.push('', '▫️ ' + g); for (const f of fs) out.push(`${META[f.name][1]}: ${f.type === 'bool' ? (state[f.name] ? 'بله' : 'نه') : (state[f.name] === '' ? '—' : state[f.name])}`); }
  if (gridItems().length) { out.push('', '▫️ مقایسه (' + gridItems().reduce((a, [, v]) => a * v.length, 1) + ' حالت)'); for (const [k, v] of gridItems()) out.push(`${META[k][1]}: ${v.join('، ')}`); }
  return out.join('\n');
}
async function copy(text, msg) {
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length); try { ok = document.execCommand('copy'); } catch (e2) {} ta.remove();
  }
  toast(ok ? msg : 'کپی نشد — دوباره امتحان کن');
}
function toast(t) { const el = document.getElementById('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), 1800); }
document.getElementById('copyColab').onclick = () => copy(colabCell(), 'سلولِ Colab کپی شد');
document.getElementById('copyTg').onclick = () => copy(telegram(), 'متنِ تلگرام کپی شد');
document.getElementById('reset').onclick = () => { state = {...DEF}; multi = {}; try { localStorage.removeItem('lab-settings-v2'); } catch (e) {} render(); toast('به پیش‌فرض برگشت'); };
document.querySelectorAll('[data-preset]').forEach(b => b.onclick = () => { const p = {...PRESETS[b.dataset.preset]}; const m = p._multi; delete p._multi; state = {...DEF, ...p}; multi = m ? JSON.parse(JSON.stringify(m)) : {}; save(); render(); toast(b.textContent + ' انتخاب شد'); });
function ladder() {
  const s = state, multi = s.EXIT_MODE === 'multi';
  const lv = r => 1 - r;                      // موقعیت نسبت به موج: کف = ۰، سقف = ۱
  const pts = [{p: -(s.SL_PAD_PCT || 0) / 100 * 3, t: 'SL', c: 'var(--short)'}, {p: lv(s.ENTRY_LEVEL), t: 'ورود ' + s.ENTRY_LEVEL, c: 'var(--gold)'}];
  if (multi) { pts.push({p: 1, t: `TP1 · ${Math.round(s.TP1_PART * 100)}٪`, c: 'var(--long)'}, {p: s.TP2_EXT, t: `TP2 ${s.TP2_EXT} · ${Math.round(s.TP2_PART * 100)}٪`, c: 'var(--long)'});
    const r3 = Math.max(0, Math.round((1 - s.TP1_PART - s.TP2_PART) * 100));
    pts.push(s.TP3_MODE === 'extension' ? {p: s.TP3_EXT, t: `TP3 ${s.TP3_EXT} · ${r3}٪`, c: 'var(--long)'} : {p: Math.max(s.TP2_EXT, 1) + .25, t: s.TP3_MODE === 'divergence' ? `TP3 واگرایی · ${r3}٪` : 'بدونِ TP3', c: 'var(--muted)'}); }
  else pts.push({p: 1 + (s.SINGLE_TP_EXTRA_PCT || 0) / 100 * 3, t: `TP سطحِ ۰ +${s.SINGLE_TP_EXTRA_PCT}٪`, c: 'var(--long)'});
  const lo = Math.min(-0.05, ...pts.map(x => x.p)), hi = Math.max(1.1, ...pts.map(x => x.p));
  const y = p => 150 - (p - lo) / (hi - lo) * 135;
  let g = `<line x1="40" y1="${y(0)}" x2="40" y2="${y(1)}" stroke="var(--ink)" stroke-width="3"/>`;
  g += `<text x="34" y="${y(0) + 4}" font-size="12" fill="var(--muted)" text-anchor="end">۱</text><text x="34" y="${y(1) + 4}" font-size="12" fill="var(--muted)" text-anchor="end">۰</text>`;
  const used = [];
  for (const q of pts.sort((a, b) => a.p - b.p)) { let yy = y(q.p); while (used.some(u => Math.abs(u - yy) < 15)) yy -= 15; used.push(yy);
    g += `<line x1="48" y1="${y(q.p)}" x2="420" y2="${y(q.p)}" stroke="${q.c}" stroke-width="2" ${q.c === 'var(--muted)' ? 'stroke-dasharray="5 5"' : ''}/><text x="428" y="${yy + 4}" font-size="14" font-weight="700" fill="${q.c}">${q.t}</text>`; }
  document.getElementById('lad').innerHTML = g;
}
render();
</script>
